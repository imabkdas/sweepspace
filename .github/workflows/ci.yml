name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
      
    - name: Build ScannerCore
      working-directory: Packages/ScannerCore
      run: swift build
      
    - name: Test ScannerCore
      working-directory: Packages/ScannerCore
      run: swift test
      
    - name: Lint
      working-directory: Packages/ScannerCore
      run: swift format lint -r Sources Tests || echo "swift-format not installed, skipping"
