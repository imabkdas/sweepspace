name: SpaceSweep
options:
  bundleIdPrefix: com.example
targets:
  SpaceSweep:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      MARKETING_VERSION: "1.1"
      CURRENT_PROJECT_VERSION: "2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: SpaceSweep/SpaceSweep/SpaceSweepApp.swift
      - path: App
      - path: SpaceSweep/SpaceSweep/Assets.xcassets
    dependencies:
      - package: ScannerCore
packages:
  ScannerCore:
    path: Packages/ScannerCore
